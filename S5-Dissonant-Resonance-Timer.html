<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Language" content="en">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080b12">
<title>Dissonant Resonance Timer | Once Human</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Teko:wght@400;700;900&display=swap');
:root{color-scheme:dark;--amber:#ffad32;--orange:#ff5d2e;--cyan:#91efff}
*{box-sizing:border-box}
body{min-height:100vh;margin:0;padding:24px;background:radial-gradient(ellipse at 50% 10%,#25140b 0,#09090d 52%,#030407 100%);color:#fff;font-family:'Teko',sans-serif;display:grid;place-items:center}
.page{width:min(100%,760px);position:relative;padding:82px 36px 32px;border:1px solid rgba(255,173,50,.35);border-radius:28px;background:linear-gradient(145deg,rgba(18,18,24,.96),rgba(8,8,12,.96));box-shadow:0 0 42px rgba(255,128,24,.12),inset 0 0 32px rgba(255,255,255,.025);overflow:hidden}
.page:before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 0,rgba(255,132,34,.12),transparent 58%)}
.top,.content{position:relative;z-index:1}
.top{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
a,.notify{border:1px solid rgba(255,173,50,.35);border-radius:8px;padding:9px 13px;background:rgba(255,173,50,.08);color:#ffe0a3;font:700 .72rem 'Teko',sans-serif;text-decoration:none;letter-spacing:.04em}
a:hover,.notify:hover,.notify[aria-pressed="true"]{background:rgba(255,173,50,.2)}
.notify{display:none;cursor:pointer}
.brand{text-align:center;color:#ffca76;font-size:.8rem;letter-spacing:.32em}
h1{margin:12px 0 24px;text-align:center;font-size:clamp(1.7rem,6vw,3rem);line-height:1.15;letter-spacing:.07em;text-shadow:0 0 26px rgba(255,133,38,.22)}
.status{width:fit-content;max-width:100%;margin:0 auto 22px;padding:12px 20px;border:1px solid rgba(255,173,50,.35);border-radius:99px;background:rgba(255,120,28,.08);color:#ffd69a;text-align:center;font-size:clamp(.65rem,2.4vw,.9rem);letter-spacing:.08em}
.status.live{border-color:rgba(255,93,46,.7);background:rgba(255,80,40,.16);color:#ffb08c}
.clock{display:flex;justify-content:center;align-items:center;gap:14px}
.unit{width:min(40%,260px);padding:24px 12px 18px;text-align:center;border:1px solid rgba(255,173,50,.3);border-radius:18px;background:linear-gradient(180deg,rgba(255,150,50,.12),rgba(60,25,14,.12));box-shadow:inset 0 0 22px rgba(255,173,50,.04)}
.value{font-size:clamp(3.2rem,14vw,7.2rem);font-weight:900;line-height:1;color:#fff0d4;text-shadow:0 0 25px rgba(255,164,58,.28);font-variant-numeric:tabular-nums}
.label{margin-top:8px;color:#c39b6a;font-size:.7rem;letter-spacing:.2em}
.boss-panel{width:min(100%,430px);margin:20px auto 0;padding:14px 18px 12px;border:1px solid rgba(255,173,50,.3);border-radius:14px;background:rgba(255,120,28,.07);text-align:center}
.boss-status{color:#ffd69a;font-size:1.15rem;font-weight:700;letter-spacing:.08em}
.boss-clock{display:flex;justify-content:center;align-items:center;gap:7px;margin-top:7px;color:#fff0d4;font-size:3.25rem;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.boss-clock.hidden{display:none}
.boss-clock .boss-label{margin-left:4px;color:#c39b6a;font-size:.58rem;letter-spacing:.12em}
.boss-clock.unlocked{color:#ffb08c}
.echo-counter{width:min(100%,430px);margin:20px auto 0;padding:14px 18px;border:1px solid rgba(255,173,50,.3);border-radius:14px;background:rgba(255,120,28,.07);text-align:center;align-self:center}
.echo-counter-title{color:#ffd69a;font-size:1.15rem;font-weight:700;letter-spacing:.08em}
.echo-counter-controls{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:10px}
.echo-counter-btn{width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,173,50,.5);background:rgba(255,173,50,.08);color:#ffe0a3;font-family:'Teko',sans-serif;font-size:1.5rem;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s}
.echo-counter-btn:active{transform:scale(.9)}
.echo-counter-btn:hover{background:rgba(255,173,50,.2);box-shadow:0 0 10px rgba(255,173,50,.25)}
.echo-counter-value{min-width:90px;color:#fff0d4;font-size:3.25rem;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 0 15px rgba(255,173,50,.35)}
.echo-counter.max-reached{border-color:rgba(255,180,0,.8);background:linear-gradient(180deg,rgba(255,150,0,.18),rgba(70,40,0,.22));box-shadow:0 0 24px rgba(255,150,0,.28)}
.echo-counter.max-reached .echo-counter-value{color:#ffe6a3;text-shadow:0 0 15px #ffaa00,0 0 30px #ffaa00}
.echo-reset-btn{min-width:150px;margin:14px auto 0;padding:8px 14px;border:1px solid #ff314a;border-radius:8px;background:rgba(255,49,74,.12);color:#fff1f3;font:700 .9rem 'Teko',sans-serif;letter-spacing:.08em;cursor:pointer;box-shadow:0 0 10px rgba(255,49,74,.5),inset 0 0 8px rgba(255,49,74,.12);text-shadow:0 0 8px #ff314a;transition:.2s}
.echo-reset-btn:hover{background:rgba(255,49,74,.25);box-shadow:0 0 16px rgba(255,49,74,.8),inset 0 0 10px rgba(255,49,74,.18)}
.echo-reset-btn:active{transform:scale(.96)}
.error{min-height:1.5em;margin-top:12px;color:#ff9e9e;text-align:center;font: .8rem 'Teko',sans-serif}
.page-footer{position:fixed;left:0;right:0;bottom:0;z-index:1200;text-align:center;padding:10px 16px 12px;font-size:.72rem;color:rgba(255,255,255,.72);letter-spacing:.04em;line-height:1.5;text-shadow:0 0 8px rgba(0,0,0,.6);background:rgba(0,0,0,.28);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid rgba(255,255,255,.12)}
.page-footer a{border:0;padding:0;background:none;color:#8fefff;font:inherit;letter-spacing:inherit}
.page-footer a:hover{background:none;text-decoration:underline}
@media(max-width:520px){body{padding:12px}.page{padding:78px 16px 24px;border-radius:20px}.top{top:10px;left:10px;right:10px}.top a,.notify{padding:8px 10px;font-size:.62rem}.unit{padding:20px 8px 16px}.clock{gap:8px}.boss-status,.echo-counter-title{font-size:.95rem}.boss-clock,.echo-counter-value{font-size:2.65rem}}
</style>
</head>
<body>
<main class="page">
  <nav class="top" aria-label="Pages">
    <a href="S4-Starfall-Gravity-Abyss.html">Abyss Timer (ENDED)</a>
    <a href="Run-Tracker.html">Run Tracker</a>
    <button class="notify" id="notifyToggle" type="button" aria-pressed="false">Alerts OFF</button>
  </nav>
  <div class="content">
    <h1>DISSONANT RESONANCE</h1>
    <div class="status" id="status" aria-live="polite">CONNECTING</div>
    <div class="clock" aria-label="Time remaining">
      <div class="unit"><div class="value" id="minutes">00</div><div class="label">MIN</div></div>
      <div class="unit"><div class="value" id="seconds">00</div><div class="label">SEC</div></div>
    </div>
    <section class="echo-counter" id="echoCounter" aria-label="Echo War counter">
      <div class="echo-counter-title">The Echo War</div>
      <div class="echo-counter-controls">
        <button class="echo-counter-btn" id="echoDecrease" type="button" aria-label="Decrease Echo War count">-</button>
        <div class="echo-counter-value" id="echoCount" aria-live="polite">0 / 80</div>
        <button class="echo-counter-btn" id="echoIncrease" type="button" aria-label="Increase Echo War count">+</button>
      </div>
      <button class="echo-reset-btn" id="echoReset" type="button">Reset Counter</button>
    </section>
    <section class="boss-panel" aria-label="Boss unlock timer">
      <div class="boss-status" id="bossStatus">Getting ready to fight!</div>
      <div class="boss-clock" id="bossClock">
        <span id="bossMinutes">--</span><span>:</span><span id="bossSeconds">--</span><span class="boss-label">MIN : SEC</span>
      </div>
    </section>
    <div class="error" id="message" role="status"></div>
  </div>
</main>
<script>
(() => {
  'use strict';
  const EVENT_START = 15 * 60 - 1;
  const EVENT_END = 45 * 60 - 1;
  const BATTLE_START = 30 * 60 - 1;
  const STORAGE_KEY = 'ohStarfall.atonalAlerts';
  const ECHO_COUNTER_KEY = 'ohStarfall.echoWarCount';
  const ECHO_COUNTER_CAP = 80;
  const $ = id => document.getElementById(id);
  const status = $('status');
  const notifyButton = $('notifyToggle');
  const message = $('message');
  let alertsEnabled = false;
  let notified = new Set();
  let echoWarCount = 0;

  try {
    alertsEnabled = localStorage.getItem(STORAGE_KEY) === 'true';
  } catch (error) {
    console.error('Could not load notification settings:', error);
    message.textContent = 'Could not load saved notification settings.';
  }

  function setAlertButton() {
    notifyButton.textContent = alertsEnabled ? 'Alerts ON' : 'Alerts OFF';
    notifyButton.setAttribute('aria-pressed', String(alertsEnabled));
  }

  function notifyOnce(key, eventHour, title, body) {
    const stamp = eventHour + ':' + key;
    if (!alertsEnabled || notified.has(stamp) || !('Notification' in window) || Notification.permission !== 'granted') return;
    notified.add(stamp);
    new Notification(title, { body });
  }

  function checkAlert(left, windowSeconds, key, hour, title, body) {
    if (left >= windowSeconds - 2 && left <= windowSeconds) notifyOnce(key, hour, title, body);
  }

  function updateEchoCounter() {
    $('echoCount').textContent = echoWarCount + ' / ' + ECHO_COUNTER_CAP;
    $('echoCounter').classList.toggle('max-reached', echoWarCount >= ECHO_COUNTER_CAP);
  }

  function changeEchoCount(amount) {
    const nextCount = echoWarCount + amount;
    echoWarCount = Math.max(0, Math.min(ECHO_COUNTER_CAP, nextCount));
    try {
      localStorage.setItem(ECHO_COUNTER_KEY, String(echoWarCount));
    } catch (error) {
      console.error('Could not save the Echo War count:', error);
      message.textContent = 'Could not save the Echo War count in this browser.';
    }
    updateEchoCounter();
  }

  try {
    echoWarCount = Math.max(0, Math.min(ECHO_COUNTER_CAP, parseInt(localStorage.getItem(ECHO_COUNTER_KEY), 10) || 0));
  } catch (error) {
    console.error('Could not load the Echo War count:', error);
  }

  $('echoDecrease').addEventListener('click', () => changeEchoCount(-1));
  $('echoIncrease').addEventListener('click', () => changeEchoCount(1));
  $('echoReset').addEventListener('click', () => changeEchoCount(-echoWarCount));
  updateEchoCounter();

  function update() {
    const now = new Date();
    const current = now.getMinutes() * 60 + now.getSeconds() + now.getMilliseconds() / 1000;
    const hourStamp = Math.floor(Date.now() / 3600000);
    const active = current >= EVENT_START && current < EVENT_END;
    const nextEventHour = current < EVENT_START ? hourStamp : hourStamp + 1;
    const eventLeft = active ? -1 : (current < EVENT_START ? EVENT_START - current : 3600 + EVENT_START - current);
    const eventEndLeft = active ? EVENT_END - current : -1;
    const remaining = active ? eventEndLeft : eventLeft;
    const battleLeft = active && current < BATTLE_START ? BATTLE_START - current : -1;

    status.textContent = active ? 'DISSONANT RESONANCE IN PROGRESS' : 'NEXT DISSONANT RESONANCE STARTS IN';
    status.classList.toggle('live', active);
    const displayRemaining = Math.ceil(remaining);
    $('minutes').textContent = String(Math.floor(displayRemaining / 60)).padStart(2, '0');
    $('seconds').textContent = String(displayRemaining % 60).padStart(2, '0');

    const echoWarClosing = active && current >= BATTLE_START;
    $('bossClock').classList.toggle('unlocked', echoWarClosing);

    if (!active) {
      $('bossStatus').textContent = 'Getting ready to fight!';
      $('bossClock').classList.add('hidden');
    } else if (echoWarClosing) {
      const closingRemaining = Math.max(0, Math.ceil(eventEndLeft));
      $('bossStatus').textContent = 'The Echo War is closing in';
      $('bossClock').classList.remove('hidden');
      $('bossMinutes').textContent = String(Math.floor(closingRemaining / 60)).padStart(2, '0');
      $('bossSeconds').textContent = String(closingRemaining % 60).padStart(2, '0');
    } else {
      const startingRemaining = Math.max(0, Math.ceil(battleLeft));
      $('bossStatus').textContent = 'The Echo War will start in';
      $('bossClock').classList.remove('hidden');
      $('bossMinutes').textContent = String(Math.floor(startingRemaining / 60)).padStart(2, '0');
      $('bossSeconds').textContent = String(startingRemaining % 60).padStart(2, '0');
    }

    const eventHour = active ? hourStamp : nextEventHour;
    checkAlert(eventLeft, 300, 'event-5m', nextEventHour, 'Dissonant Resonance', 'Starts in 5 minutes.');
    checkAlert(eventLeft, 60, 'event-1m', nextEventHour, 'Dissonant Resonance', 'Starts in 1 minute.');
    if (active && current >= EVENT_START && current <= EVENT_START + 2) notifyOnce('event-start', hourStamp, 'Dissonant Resonance', 'The event has started.');
    checkAlert(eventEndLeft, 60, 'event-end-1m', eventHour, 'Dissonant Resonance', 'Ends in 1 minute.');
    checkAlert(battleLeft, 180, 'battle-3m', hourStamp, 'The Echo War', 'Starts in 3 minutes.');
    checkAlert(battleLeft, 60, 'battle-1m', hourStamp, 'The Echo War', 'Starts in 1 minute.');
    if (active && current >= BATTLE_START && current <= BATTLE_START + 2) notifyOnce('battle-start', hourStamp, 'The Echo War', 'The Echo War has started.');
  }

  notifyButton.addEventListener('click', async () => {
    if (!('Notification' in window)) {
      message.textContent = 'This browser does not support notifications.';
      return;
    }
    try {
      if (!alertsEnabled && Notification.permission !== 'granted') {
        const permission = await Notification.requestPermission();
        if (permission !== 'granted') {
          message.textContent = 'Allow browser notifications to turn alerts on.';
          return;
        }
      }
      alertsEnabled = !alertsEnabled;
      try {
        localStorage.setItem(STORAGE_KEY, String(alertsEnabled));
      } catch (error) {
        console.error('Could not save notification settings:', error);
        message.textContent = 'Could not save notification settings in this browser.';
      }
      if (!message.textContent.startsWith('Could not save')) {
        message.textContent = '';
      }
      setAlertButton();
      update();
    } catch (error) {
      console.error('Could not enable browser notifications:', error);
      message.textContent = 'Could not enable browser notifications.';
    }
  });

  setAlertButton();
  update();
  setInterval(update, 1000);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') update();
  });
})();
</script>
